<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>graphify - graph.json</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #graph { flex: 1; }
  #sidebar { width: 280px; background: #1a1a2e; border-left: 1px solid #2a2a4e; display: flex; flex-direction: column; overflow: hidden; }
  #search-wrap { padding: 12px; border-bottom: 1px solid #2a2a4e; }
  #search { width: 100%; background: #0f0f1a; border: 1px solid #3a3a5e; color: #e0e0e0; padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #4E79A7; }
  #search-results { max-height: 140px; overflow-y: auto; padding: 4px 12px; border-bottom: 1px solid #2a2a4e; display: none; }
  .search-item { padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-item:hover { background: #2a2a4e; }
  #info-panel { padding: 14px; border-bottom: 1px solid #2a2a4e; min-height: 140px; }
  #info-panel h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #info-content { font-size: 13px; color: #ccc; line-height: 1.6; }
  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: #e0e0e0; }
  #info-content .empty { color: #555; font-style: italic; }
  .neighbor-link { display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #333; }
  .neighbor-link:hover { background: #2a2a4e; }
  #neighbors-list { max-height: 160px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .legend-item:hover { background: #2a2a4e; padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: #666; font-size: 11px; }
  #stats { padding: 10px 14px; border-top: 1px solid #2a2a4e; font-size: 11px; color: #555; }
  #legend-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0; }
  #legend-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #aaa; user-select: none; }
  #legend-controls label:hover { color: #e0e0e0; }
  .legend-cb, #select-all-cb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid #3a3a5e; border-radius: 3px; background: #0f0f1a; cursor: pointer; position: relative; flex-shrink: 0; }
  .legend-cb:checked, #select-all-cb:checked { background: #4E79A7; border-color: #4E79A7; }
  .legend-cb:checked::after, #select-all-cb:checked::after { content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  #select-all-cb:indeterminate { background: #4E79A7; border-color: #4E79A7; }
  #select-all-cb:indeterminate::after { content: ''; position: absolute; left: 2px; top: 5px; width: 8px; height: 2px; background: #fff; border: none; transform: none; }
  #controls { padding: 8px 12px; border-bottom: 1px solid #2a2a4e; display: flex; gap: 8px; }
  #freeze-btn { background: #2a2a4e; border: 1px solid #3a3a5e; color: #aaa; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  #freeze-btn:hover { background: #3a3a5e; color: #e0e0e0; }
  #freeze-btn.active { background: #4E79A7; color: #fff; border-color: #4E79A7; }
  #loading { padding: 20px; color: #666; }
  #color-legend { font-size: 10px; color: #666; padding: 4px 12px; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="sidebar">
  <div id="controls"><button id="freeze-btn" onclick="togglePhysics()">⏸ Freeze</button></div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search nodes..." autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div id="info-panel">
    <h3>Node Info</h3>
    <div id="info-content"><span class="empty">Click a node to inspect it</span></div>
  </div>
  <div id="legend-wrap">
    <h3>Communities</h3>
    <div id="legend-controls">
      <label><input type="checkbox" id="select-all-cb" checked onchange="toggleAllCommunities(!this.checked)">Select All</label>
    </div>
    <div id="color-legend">Colors random each page load</div>
    <div id="legend"></div>
  </div>
  <div id="stats">Loading...</div>
</div>
<div id="loading">Loading graph.json...</div>
<script>
// Global variables
let network, nodesDS, edgesDS;
let communityVisibility = {};
let physicsEnabled = true;
let memoryIndex = {};  // node_id → [memory_ids]

// Generate deterministic color from community ID
function getColor(communityId) {
  const seed = (communityId * 9301 + 49297) % 233280;
  const rand = seed / 233280;
  const hue = Math.floor(rand * 360);
  return `hsl(${hue}, 65%, 55%)`;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function init() {
  try {
    const [graphRes, memoryRes] = await Promise.all([
      fetch('graph.json'),
      fetch('memory/index.json').catch(() => ({ ok: false }))
    ]);
    const data = await graphRes.json();
    
    let memoryIndex = {};
    if (memoryRes.ok) {
      try {
        memoryIndex = await memoryRes.json();
      } catch (e) {
        memoryIndex = {};
      }
    }
    window.memoryIndex = memoryIndex;
    
    const nodes = data.nodes || [];
    const links = data.links || [];
    const communities = data.communities || [];
    
    document.getElementById('loading').style.display = 'none';
    
    // Build community lookup
    const communityMap = {};
    communities.forEach(c => {
      communityMap[c.id] = { label: c.label, color: getColor(c.id) };
    });
    
    // Build degree map
    const degreeMap = {};
    nodes.forEach(n => degreeMap[n.id] = 0);
    links.forEach(l => {
      degreeMap[l.source] = (degreeMap[l.source] || 0) + 1;
      degreeMap[l.target] = (degreeMap[l.target] || 0) + 1;
    });
    
    // Build community counts
    const communityCounts = {};
    nodes.forEach(n => {
      const c = n.community;
      if (c !== undefined && c !== null) {
        communityCounts[c] = (communityCounts[c] || 0) + 1;
      }
    });
    
    // Build nodes for vis
    const rawNodes = nodes.map(n => {
      const comm = n.community !== undefined && n.community !== null ? parseInt(n.community) : null;
      const commData = comm !== null ? communityMap[comm] : null;
      const color = commData ? commData.color : '#999';
      const commLabel = commData ? commData.label : 'Unknown';
      return {
        id: n.id,
        label: n.label || n.id,
        color: { background: color, border: color, highlight: { background: "#ffffff", border: color }},
        size: 10 + Math.min(degreeMap[n.id] || 0, 20),
        font: { size: 0, color: "#ffffff" },
        title: n.label || n.id,
        community: comm,
        community_name: commLabel,
        source_file: n.source_file || "",
        file_type: n.file_type || "code",
        degree: degreeMap[n.id] || 0,
      };
    });
    
    // Build edges
    const rawEdges = links.map((l, i) => ({
      from: l.source,
      to: l.target,
      label: l.relation || "",
      title: (l.relation || "") + " [" + (l.confidence || "EXTRACTED") + "]",
      dashes: (l.confidence || "EXTRACTED") === "INFERRED",
      width: (l.confidence || "EXTRACTED") === "EXTRACTED" ? 2 : 1,
      color: { opacity: (l.confidence || "EXTRACTED") === "EXTRACTED" ? 0.7 : 0.35 },
      confidence: l.confidence || "EXTRACTED",
    }));
    
    // Build legend
    const legend = [];
    const activeComms = Object.keys(communityCounts).map(c => parseInt(c)).sort((a, b) => a - b);
    activeComms.forEach(c => {
      const commData = communityMap[c];
      if (commData) {
        legend.push({
          cid: c,
          color: commData.color,
          label: commData.label,
          count: communityCounts[c],
        });
      }
    });
    
    document.getElementById('stats').textContent = nodes.length + " nodes · " + links.length + " edges · " + communities.length + " communities";
    
    window.RAW_NODES = rawNodes;
    window.RAW_EDGES = rawEdges;
    window.LEGEND = legend;
    
    nodesDS = new vis.DataSet(rawNodes.map(n => ({
      id: n.id, label: n.label, color: n.color, size: n.size,
      font: n.font, title: n.title,
      _community: n.community, _community_name: n.community_name,
      _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
    })));
    
    edgesDS = new vis.DataSet(rawEdges.map((e, i) => ({
      id: i, from: e.from, to: e.to,
      label: '',
      title: e.title,
      dashes: e.dashes,
      width: e.width,
      color: e.color,
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
    })));
    
    const container = document.getElementById('graph');
    network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
      physics: { enabled: true, solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.01, springLength: 100, springConstant: 0.08 } },
      nodes: { shape: 'dot', borderWidth: 1, shadow: { enabled: true, color: 'rgba(0,0,0,0.3)', size: 4, x: 2, y: 2 } },
      edges: { smooth: { type: 'continuous' } },
      interaction: { hover: true, tooltipDelay: 100, hideEdgesOnDrag: true },
    });
    
    legend.forEach(l => communityVisibility[l.cid] = true);
    
    function renderLegend() {
      const wrap = document.getElementById('legend');
      wrap.innerHTML = legend.map(l => `
        <div class="legend-item${communityVisibility[l.cid] ? '' : ' dimmed'}" onclick="toggleCommunity(${l.cid})">
          <input type="checkbox" class="legend-cb" ${communityVisibility[l.cid] ? 'checked' : ''}>
          <span class="legend-dot" style="background:${l.color}"></span>
          <span class="legend-label">${esc(l.label)}</span>
          <span class="legend-count">${l.count}</span>
        </div>
      `).join('');
    }
    
    window.toggleCommunity = function(cid) {
      communityVisibility[cid] = !communityVisibility[cid];
      const nodesToUpdate = nodesDS.get({ filter: n => n._community === cid });
      nodesDS.update(nodesToUpdate.map(n => ({ id: n.id, hidden: !communityVisibility[cid] })));
      renderLegend();
    };
    
    window.toggleAllCommunities = function(hide) {
      legend.forEach(l => communityVisibility[l.cid] = !hide);
      const updates = [];
      nodesDS.forEach(n => {
        if (n._community !== undefined) updates.push({ id: n.id, hidden: !communityVisibility[n._community] });
      });
      nodesDS.update(updates);
      renderLegend();
    };
    
    renderLegend();
    
    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      const results = document.getElementById('search-results');
      if (!q) { results.style.display = 'none'; return; }
      const matches = rawNodes.filter(n => n.label.toLowerCase().includes(q)).slice(0, 8);
      results.innerHTML = matches.map(n => `<div class="search-item" onclick="focusNode('${esc(n.id)}')">${esc(n.label)}</div>`).join('');
      results.style.display = matches.length ? 'block' : 'none';
    });
    
    window.focusNode = function(id) {
      network.selectNodes([id]);
      network.focus(id, { scale: 1.2, animation: true });
      showNodeInfo(id);
    };
    
    // Memory visibility state per node
    let memoryState = {}; // nodeId → boolean (true = expanded)

    function showNodeInfo(id) {
      const n = rawNodes.find(x => x.id === id);
      const panel = document.getElementById('info-content');
      if (!n) { panel.innerHTML = '<span class="empty">Click a node to inspect it</span>'; return; }
      const edges = rawEdges.filter(e => (e.from === id || e.to === id) && e.label !== 'memory');
      const neighbors = edges.map(e => {
        const tid = e.from === id ? e.to : e.from;
        const tn = rawNodes.find(x => x.id === tid);
        return tn ? `<div class="neighbor-link" onclick="focusNode('${esc(tn.id)}')" style="border-left-color:${getNodeColor(tn._community)}">${esc(tn.label)} <small>(${e.label})</small></div>` : '';
      }).join('');
      
      const memoryButton = window.memoryIndex && window.memoryIndex[id] 
        ? `<button onclick="toggleMemory('${id}')" style="margin-left:8px;background:#2a2a4e;border:1px solid #3a3a5e;color:#aaa;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px">Memory</button>`
        : '';
      
      panel.innerHTML = `
        <div class="field"><b>Label:</b> ${esc(n.label)}</div>
        <div class="field"><b>Type:</b> ${n.file_type || '?'}</div>
        <div class="field"><b>Community:</b> ${esc(n.community_name)}</div>
        <div class="field"><b>Source:</b> ${esc(n.source_file)}</div>
        <div class="field"><b>Degree:</b> ${n.degree}</div>
        ${memoryButton}
        <div id="neighbors-list"><b>Neighbors:</b>${neighbors || '<span class="empty"> none</span>'}</div>
      `;
      
      // Restore memory state if was expanded
      if (memoryState[id]) {
        loadMemoryContent(id);
      }
    }
    
    function getNodeColor(community) {
      const item = legend.find(x => x.cid === community);
      return item ? item.color : '#999';
    }
    
    network.on('click', params => {
      if (params.nodes.length) showNodeInfo(params.nodes[0]);
    });
    
    // Load memory content into panel (no state change)
    async function loadMemoryContent(nodeId) {
      const memoryIds = window.memoryIndex[nodeId];
      if (!memoryIds || !memoryIds.length) return;
      
      const items = [];
      for (const mid of memoryIds) {
        try {
          const res = await fetch('memory/items/' + mid + '.json');
          if (res.ok) items.push(await res.json());
        } catch (e) {}
      }
      
      if (!items.length) return;
      
      items.sort((a, b) => (b.created || '').localeCompare(a.created || ''));
      
      let supersededIds = new Set();
      for (const m of items) {
        if (m.superseded_by) supersededIds.add(m.superseded_by);
      }
      
      let latestByTag = {};
      for (const m of items) {
        const tags = (m.tags || []).sort().join(',');
        if (!latestByTag[tags] || m.created > latestByTag[tags].created) {
          latestByTag[tags] = m;
        }
      }
      const latestIds = new Set(Object.values(latestByTag).map(m => m.id));
      
      const panel = document.getElementById('info-content');
      const memoryList = items.map(m => {
        const isSuperseded = m.superseded_by || false;
        const isLatest = latestIds.has(m.id);
        const supersededBy = isSuperseded ? m.superseded_by : (m.supersedes ? m.supersedes : null);
        
        let style = 'margin:8px 0;padding:8px;background:#1a1a2e;border-radius:4px;';
        if (isSuperseded) {
          style += 'border-left:3px solid #555;opacity:0.6;text-decoration:line-through;';
        } else if (isLatest) {
          style += 'border-left:3px solid #4E79A7;';
        } else {
          style += 'border-left:3px solid #666;';
        }
        
        let extraInfo = '';
        if (isSuperseded && supersededBy) {
          extraInfo = `<div style="color:#666;font-size:11px;margin-top:4px">Superseded by: ${supersededBy}</div>`;
        } else if (m.supersedes) {
          extraInfo = `<div style="color:#4E79A7;font-size:11px;margin-top:4px">Supersedes: ${m.supersedes}</div>`;
        }
        
        return `<div style="${style}font-size:12px">
          <div style="color:#888;margin-bottom:4px">${m.created ? m.created.substring(0, 16) : '?'} ${isLatest ? '[LATEST]' : (isSuperseded ? '[SUPERSEDED]' : '')}</div>
          <div>${esc(m.text)}</div>
          <div style="color:#666;font-size:11px;margin-top:4px">tags: ${(m.tags || []).join(', ')}</div>
          ${extraInfo}
        </div>`;
      }).join('');
      
      panel.innerHTML += `<div class="memory-section" style="margin-top:12px;padding-top:12px;border-top:1px solid #333"><b>Memory:</b> (${items.length} total)</b>${memoryList}</div>`;
    }
    
    // Toggle memory visibility and update state
    window.toggleMemory = async function(nodeId) {
      const panel = document.getElementById('info-content');
      const existingMemory = panel.querySelector('.memory-section');
      
      if (existingMemory) {
        // Hide - remove from DOM and update state
        existingMemory.remove();
        memoryState[nodeId] = false;
      } else {
        // Show - load content and update state
        memoryState[nodeId] = true;
        await loadMemoryContent(nodeId);
      }
    };
    
    window.togglePhysics = function() {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      document.getElementById('freeze-btn').textContent = physicsEnabled ? '⏸ Freeze' : '▶ Play';
      document.getElementById('freeze-btn').classList.toggle('active', !physicsEnabled);
    };
  } catch (err) {
    document.getElementById('loading').textContent = 'Error: ' + err.message;
  }
}

init();
</script>
</body>
</html>
